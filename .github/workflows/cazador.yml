name: Cazador de ofertas

on:
  schedule:
    - cron: "17 */2 * * *"   # respaldo: cada corrida lanza la siguiente; esto la reanuda si la cadena se corta
  workflow_dispatch:
    inputs:
      prueba:
        description: "Revisión de prueba (manda mensaje a Telegram y guarda un reporte)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cazador
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Recuperar historial de precios
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: historial-${{ github.run_id }}
          restore-keys: historial-

      - name: Revisar tiendas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m cazador ${{ inputs.prueba && '--prueba' || '--bucle' }}

      - name: Guardar historial de precios
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: historial-${{ github.run_id }}

      - name: Lanzar la tanda siguiente
        if: ${{ !inputs.prueba && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cazador.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Publicar reporte de prueba
        if: inputs.prueba
        run: |
          cd reporte
          git init -q -b reporte
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Reporte de prueba"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reporte
